name: Build ShadowFiles APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p /tmp/godot_templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp /tmp/godot_templates/templates/android_debug.apk /github/home/.local/share/godot/export_templates/4.3.stable/
          cp /tmp/godot_templates/templates/android_release.apk /github/home/.local/share/godot/export_templates/4.3.stable/
          echo "4.3.stable" > /github/home/.local/share/godot/export_templates/4.3.stable/version.txt

      - name: Configure Java
        run: |
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "Java path: $JAVA_HOME"

      - name: Create debug keystore
        run: |
          mkdir -p /github/home/.android
          keytool -genkeypair \
            -v \
            -keystore /github/home/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ShadowFiles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFiles-APK
          path: build/ShadowFiles.apk

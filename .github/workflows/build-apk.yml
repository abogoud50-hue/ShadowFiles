name: Build ShadowFiles APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ShadowFiles.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFiles-APK
          path: build/ShadowFiles.apk
